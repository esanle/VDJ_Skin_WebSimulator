<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDJ Skin Simulator</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-brand">🎛️ VDJ Skin Simulator</span>
        <select id="skin-select" class="skin-select">
            <option value="">Loading skins...</option>
        </select>
        <span id="element-count" class="element-count"></span>
    </div>
    <div class="skin-wrapper">
        <div id="skin-container"></div>
    </div>

    <script src="scripts/vdj-parser.js"></script>
    <script src="scripts/vdj-renderer.js"></script>
    <script>
    (function() {
        const container = document.getElementById('skin-container');
        const skinSelect = document.getElementById('skin-select');
        const elementCount = document.getElementById('element-count');

        const SKINS = [
            { name: 'VirtualDJ Pro', xml: 'skins/Default/Pro.xml', image: 'skins/Default/gfx-pro.png' },
            { name: 'VirtualDJ Essentials', xml: 'skins/Default/Essentials.xml', image: 'skins/Default/gfx-basic.png' },
            { name: 'VirtualDJ Performance', xml: 'skins/Default/Performance.xml', image: 'skins/Default/gfx-pro.png' },
            { name: 'VirtualDJ Starter', xml: 'skins/Default/Starter.xml', image: 'skins/Default/gfx-basic.png' },
            { name: 'VirtualDJ Vertical', xml: 'skins/Default/Vertical.xml', image: 'skins/Default/gfx-pro.png' },
        ];

        let currentSkin = null;
        let parser = new VdjParser();
        let renderer = null;

        skinSelect.innerHTML = SKINS.map((s, i) => `<option value="${i}">${s.name}</option>`).join('');

        async function loadSkin(index) {
            const skinDef = SKINS[index];
            skinSelect.value = index;
            elementCount.textContent = 'Loading...';

            try {
                const [xmlRes, _imgRes] = await Promise.all([
                    fetch(skinDef.xml),
                    fetch(skinDef.image)
                ]);

                if (!xmlRes.ok) throw new Error(`Failed to load ${skinDef.xml}: ${xmlRes.status}`);
                const xmlText = await xmlRes.text();

                const startTime = performance.now();
                const skin = parser.parse(xmlText);
                const parseTime = (performance.now() - startTime).toFixed(1);

                const renderStart = performance.now();
                renderer = new VdjRenderer(container, {
                    imagePath: skinDef.image,
                    scale: 1.0,
                    skinWidth: skin.meta.width,
                    skinHeight: skin.meta.height,
                });
                renderer.render(skin);
                const renderTime = (performance.now() - renderStart).toFixed(1);

                elementCount.textContent = `${skin.elements.length} elements · Parse ${parseTime}ms · Render ${renderTime}ms · ${skinDef.name}`;
                currentSkin = skin;

                console.log(`Skin: ${skin.meta.name}`, skin.meta);
                console.log(`Elements: ${skin.elements.length}`, skin.elements.slice(0, 5));
            } catch (err) {
                container.innerHTML = `<div class="error">Error: ${err.message}</div>`;
                elementCount.textContent = 'Error';
                console.error(err);
            }
        }

        skinSelect.addEventListener('change', () => loadSkin(parseInt(skinSelect.value)));

        loadSkin(0);
    })();
    </script>
</body>
</html>
